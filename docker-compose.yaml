services:
  cc-monitor:
    image: ghcr.io/bolunhan/cc-monitor:latest
    container_name: cc-monitor
    network_mode: host
    restart: unless-stopped
    volumes:
      # Named volume persists server state across container rebuilds.
      # Hook scripts are installed on the host via the one-liner — the
      # container never touches host files.
      - cc-monitor-data:/data

volumes:
  cc-monitor-data:
