services:
  cc-monitor:
    image: ghcr.io/bolunhan/cc-monitor:latest
    container_name: cc-monitor
    network_mode: host
    restart: unless-stopped
    volumes:
      # Visible bind mount for all persistent state (sessions, tokens,
      # pairing, certs). Survives restart, `down`, `down -v`, and image
      # upgrades. Kept OUT of ~/.cc-monitor itself so a native cc-monitor
      # on the same host doesn't share/conflict with the same files.
      - ${HOME}/.cc-monitor/docker/data:/data/.cc-monitor
