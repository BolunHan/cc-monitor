services:
  cc-monitor:
    image: cc-monitor:latest
    container_name: cc-monitor
    network_mode: host
    restart: unless-stopped
    volumes:
      # Session state, tokens, hook scripts, marker file.
      # IMPORTANT: replace /home/bolun with your actual home directory,
      # or use `HOME=/home/youruser sudo -E docker compose up -d`.
      - /home/bolun/.cc-monitor:/root/.cc-monitor
