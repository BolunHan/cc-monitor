services:
  cc-monitor:
    image: cc-monitor:latest
    container_name: cc-monitor
    network_mode: host
    restart: unless-stopped
    # Run as the host user so files in ~/.cc-monitor are owned correctly.
    # ${UID} and ${GID} must be set in the environment before running.
    user: "${UID}:${GID}"
    volumes:
      # Mount to /data/.cc-monitor (not /root) — /root is mode 700, non-root can't traverse.
      # Must be /data/.cc-monitor because _safe_home() returns /data and code appends /.cc-monitor.
      - ${HOME}/.cc-monitor:/data/.cc-monitor
