# GitLab CI/CD pipeline — mirrors the GitHub Actions workflows.
#
#   .github/workflows/release.yml          -> the whole tag pipeline
#     .github/workflows/build-docker.yml   ->   docker:build
#     .github/workflows/build-apk.yml      ->   apk:build
#     .github/workflows/deploy-gh-pages.yml->   pages
#     (dsh-plugin job)                     ->   dsh:package
#     (npm-publish job)                    ->   npm:publish
#                                            ->   release:assets, release
#
# GitHub Actions are DISABLED in this repository — see
# .github/workflows/README.md. GitLab is the CI of record.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables):
#   none. The container registry uses the predefined CI_REGISTRY_* variables,
#   and artifact uploads use CI_JOB_TOKEN.
#
# Optional:
#   NPM_TOKEN   only if you move npm:publish off trusted publishing. By default
#               it uses npm trusted publishing via the NPM_ID_TOKEN id_token,
#               which requires this GitLab project to be registered as a
#               trusted publisher on npmjs.com for dsh-cc-monitor. If that is
#               not configured, set this job to `when: manual` or supply
#               NPM_TOKEN instead.
#
# Provenance is disabled on purpose — see the comment on npm:publish.
#
# Docker-in-Docker is used for the image builds; GitLab.com's shared runners
# support this out of the box.

stages:
  - build
  - pages
  - publish
  - release

# Retry infrastructure failures, not code failures. A pipeline was once
# rejected outright with "Unable to run pipeline — Undefined error
# (01M28KHM94KZWFEMZDC1ATF3BD)", which is GitLab's generic internal-error
# message (it carries a Sentry event ID) and not a config problem. Retrying
# costs nothing and covers that whole class.
default:
  retry:
    max: 2
    when:
      - unknown_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure

# Trigger scope mirrors the GitHub setup exactly: every workflow over there was
# `workflow_dispatch` / `workflow_call`, so nothing ran on an ordinary push —
# only on a version tag (via release.yml) or a manual dispatch. Keeping that
# here avoids burning CI minutes on a full APK build for every commit.
# "api" is included alongside "web" so a pipeline can also be started from the
# API (or with `glab ci run`), which is how a single job gets re-tested without
# pushing a tag. Both sources produce a pipeline that runs nothing by itself.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# Shared by every build job, for the same reason.
.build_rules: &build_rules
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    when: manual

# Version stamping. On a tag pipeline the version is the tag minus its leading
# "v"; otherwise a dev stamp, matching the GitHub workflows' behaviour.
# Written to version.env so downstream jobs read it via a dotenv artifact
# instead of each recomputing it.
.version_script: &version_script
  - |
    if [ -n "$CI_COMMIT_TAG" ]; then
      VERSION="${CI_COMMIT_TAG#v}"
    else
      VERSION="dev-$(date +%Y%m%d-%H%M%S)"
    fi
    echo "CC_MONITOR_VERSION=$VERSION" > version.env
    echo "version: $VERSION"

# ---------------------------------------------------------------- Docker ----
# Mirrors build-docker.yml, pushing to the GitLab Container Registry instead
# of ghcr.io.
docker:build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  rules: *build_rules
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - *version_script
    - . ./version.env
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Tagged both without and (on tag pipelines) with the leading "v". The
    # release job's `release:` block is expanded by GitLab, not a shell, so it
    # cannot strip the "v" — having the raw tag on the image is what lets the
    # release notes print a docker pull command that actually works.
    # `set --` rather than a string, so an unset CI_COMMIT_TAG cannot leave a
    # dangling `--tag image:` on manual runs.
    - |
      set -- --cache-from "$CI_REGISTRY_IMAGE:latest" \
             --tag "$CI_REGISTRY_IMAGE:latest" \
             --tag "$CI_REGISTRY_IMAGE:$CC_MONITOR_VERSION"
      if [ -n "$CI_COMMIT_TAG" ]; then set -- "$@" --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"; fi
      docker build "$@" .
    - docker push "$CI_REGISTRY_IMAGE:$CC_MONITOR_VERSION"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - if [ -n "$CI_COMMIT_TAG" ]; then docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"; fi
  artifacts:
    reports:
      dotenv: version.env

# ------------------------------------------------------------------- APK ----
# Mirrors build-apk.yml. The cirruslabs image bundles the Android SDK and
# Java 17, which is what the GitHub action assembles with setup-java +
# subosito/flutter-action.
apk:build:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  rules: *build_rules
  script:
    - *version_script
    - flutter --version
    - flutter doctor -v
    - cd android_app
    - flutter pub get
    - flutter build apk --release
  artifacts:
    paths:
      - android_app/build/app/outputs/flutter-apk/app-release.apk
    reports:
      dotenv: version.env

# ------------------------------------------------------ DSH plugin tarball ----
dsh:package:
  stage: build
  image: node:22
  rules: *build_rules
  script:
    - mkdir -p dist
    - npm pack ./dsh-cc-monitor --pack-destination dist
    - mv dist/dsh-cc-monitor-*.tgz dist/dsh-cc-monitor.tgz
    - ls -lh dist/dsh-cc-monitor.tgz
  artifacts:
    paths:
      - dist/dsh-cc-monitor.tgz

# ----------------------------------------------------------------- Pages ----
# Mirrors deploy-gh-pages.yml. GitLab's equivalent of a Pages deploy is a job
# named exactly "pages" publishing a "public/" artifact; enable Pages in
# Settings -> Pages. The static dashboard is origin-agnostic, so it works
# unchanged from GitLab Pages.
pages:
  stage: pages
  image: alpine:latest
  rules: *build_rules
  script:
    - mkdir -p public
    - cp -r static/. public/
  artifacts:
    paths:
      - public

# ----------------------------------------------------------- npm publish ----
# Mirrors the npm-publish job in release.yml, including trusted publishing
# (the GitHub workflow uses id-token: write; this uses a GitLab id_token).
npm:publish:
  stage: publish
  image: node:22
  # Two tokens, for two different things — npm needs both here:
  #   NPM_ID_TOKEN      authenticates the publish (trusted publishing)
  #   SIGSTORE_ID_TOKEN signs the provenance attestation
  # npm fails with "Provenance generation in GitLab CI requires
  # \"SIGSTORE_ID_TOKEN\" with \"sigstore\" audience" without the second.
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: "sigstore"
  variables:
    # Provenance is OFF, deliberately.
    #
    # This repository is mirrored to GitHub and GitLab, and npm validates the
    # attestation's source against package.json. The attestation is minted from
    # whichever CI published it, so publishing here makes npm expect
    # "https://gitlab.com/BolunHan/cc-monitor" while package.json correctly says
    # "git+https://github.com/BolunHan/cc-monitor.git" — the GitHub repo is the
    # primary, more discoverable one, and that field is what npmjs.com links to.
    #
    # The publish is rejected with:
    #   422 ... Failed to validate repository information:
    #   package.json: "repository.url" is "git+https://github.com/...", expected
    #   to match "https://gitlab.com/..." from provenance
    #
    # Trusted publishing generates provenance BY DEFAULT, so simply dropping
    # --provenance is not enough — it has to be switched off explicitly.
    # To restore provenance instead, point repository.url at GitLab, at the
    # cost of the npmjs.com "repository" link leaving GitHub.
    NPM_CONFIG_PROVENANCE: "false"
  # Also playable on its own from a manually-triggered pipeline, so this job
  # can be iterated on WITHOUT re-running the whole release. A tag pipeline
  # rebuilds the APK (Flutter + Gradle) and the Docker image, which is minutes
  # of quota to re-test a one-line npm change; a web pipeline runs nothing
  # until you press play, and npm:publish is a ~1 minute job.
  #
  #   CI/CD -> Pipelines -> Run pipeline (branch: main)
  #     -> press the play button on npm:publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
  script:
    - npm install -g npm@latest
    - cd dsh-cc-monitor
    - npm publish --access public

# -------------------------------------------------- offline docker archive ----
# Mirrors the "Pull and export Docker image as tar" step of the GitHub
# release job, uploaded to the Generic Package Registry so the release can
# link to it.
release:assets:
  stage: release
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [ docker:build, apk:build, dsh:package ]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  # docker:27 is Alpine-based and does not ship curl; the uploads below need it.
  before_script:
    - apk add --no-cache curl
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE:$VERSION"
    - docker save "$CI_REGISTRY_IMAGE:$VERSION" | gzip > cc-monitor-docker.tar.gz
    - ls -lh cc-monitor-docker.tar.gz
    # Uploaded under the *raw* tag (v0.8.0, not 0.8.0) and with version-free
    # filenames, because the release job below links to these exact paths and
    # its `release:` block is expanded by GitLab rather than by a shell — it
    # cannot do "${VAR#v}" the way this script can. Keeping the version only in
    # the directory means the two can never disagree.
    - |
      upload() {
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$1" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cc-monitor/${CI_COMMIT_TAG}/$2"
      }
      upload android_app/build/app/outputs/flutter-apk/app-release.apk app-release.apk
      upload dist/dsh-cc-monitor.tgz dsh-cc-monitor.tgz
      upload cc-monitor-docker.tar.gz cc-monitor-docker.tar.gz

# --------------------------------------------------------------- Release ----
# Mirrors the GitHub Release. Note GitLab release assets are *links*, not
# uploaded files — the artifacts go to the Generic Package Registry above and
# the release points at them.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [ release:assets ]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - echo "creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "cc-monitor $CI_COMMIT_TAG"
    description: |
      ## cc-monitor $CI_COMMIT_TAG

      Claude Code session monitor with real-time dashboard.

      ### 🐳 Docker
      ```bash
      docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      docker run --network=host \
        -v ~/.cc-monitor/docker/data:/data/.cc-monitor \
        $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      ```

      ### 📱 Android
      Download `app-release.apk` below and install via ADB:
      ```bash
      adb install app-release.apk
      ```

      ### 🧩 DSH reporter plugin
      Download `dsh-cc-monitor.tgz` below, then:
      ```bash
      dsh plugin --profile web add ./dsh-cc-monitor.tgz
      ```

      ### 📦 Docker (offline)
      ```bash
      gunzip -c cc-monitor-docker.tar.gz | docker load
      ```
    assets:
      links:
        - name: "app-release.apk"
          url: "${CI_PROJECT_URL}/-/packages/generic/cc-monitor/${CI_COMMIT_TAG}/app-release.apk"
        - name: "dsh-cc-monitor.tgz"
          url: "${CI_PROJECT_URL}/-/packages/generic/cc-monitor/${CI_COMMIT_TAG}/dsh-cc-monitor.tgz"
        - name: "cc-monitor-docker.tar.gz"
          url: "${CI_PROJECT_URL}/-/packages/generic/cc-monitor/${CI_COMMIT_TAG}/cc-monitor-docker.tar.gz"
