name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${OWNER}/cc-monitor" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image as tar
        run: |
          docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          docker save ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} | \
            gzip > cc-monitor-${{ steps.meta.outputs.version }}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "cc-monitor v${{ steps.meta.outputs.version }}"
          body: |
            ## cc-monitor v${{ steps.meta.outputs.version }}

            ### Docker
            ```bash
            docker pull ghcr.io/${{ steps.meta.outputs.owner }}/cc-monitor:${{ steps.meta.outputs.version }}
            docker run -p 9876:9876 ghcr.io/${{ steps.meta.outputs.owner }}/cc-monitor:${{ steps.meta.outputs.version }}
            ```

            ### Run
            ```bash
            docker load -i cc-monitor-${{ steps.meta.outputs.version }}.tar.gz
            docker run -p 9876:9876 cc-monitor:${{ steps.meta.outputs.version }}
            ```
          files: |
            cc-monitor-${{ steps.meta.outputs.version }}.tar.gz
          generate_release_notes: true
