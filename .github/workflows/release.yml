name: Release

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "Version to release (e.g. 0.5.0)"
        default: ""

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  docker:
    uses: ./.github/workflows/build-docker.yml
    with:
      version: ${{ github.ref_name || inputs.version }}
    secrets: inherit

  apk:
    uses: ./.github/workflows/build-apk.yml
    with:
      version: ${{ github.ref_name || inputs.version }}
    secrets: inherit

  gh-pages:
    uses: ./.github/workflows/deploy-gh-pages.yml
    secrets: inherit

  dsh-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package dsh-cc-monitor plugin
        run: |
          mkdir -p dist
          npm pack ./dsh-cc-monitor --pack-destination dist
          mv dist/dsh-cc-monitor-*.tgz dist/dsh-cc-monitor.tgz
          ls -lh dist/dsh-cc-monitor.tgz

      - name: Upload dsh plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-cc-monitor-plugin
          path: dist/dsh-cc-monitor.tgz

  release:
    needs: [ docker, apk, gh-pages, dsh-plugin ]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cc-monitor-${{ needs.apk.outputs.version }}

      - name: Download DSH plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-cc-monitor-plugin

      - name: Pull and export Docker image as tar
        run: |
          VERSION="${{ needs.docker.outputs.version }}"
          IMAGE="${{ needs.docker.outputs.image }}"
          docker pull "${IMAGE}:${VERSION}"
          docker save "${IMAGE}:${VERSION}" | gzip > "cc-monitor-${VERSION}.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "cc-monitor v${{ needs.docker.outputs.version }}"
          body: |
            ## cc-monitor v${{ needs.docker.outputs.version }}

            Claude Code session monitor with real-time dashboard.

            ### 🐳 Docker
            ```bash
            docker pull ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.version }}
            docker run --network=host \
              -v ~/.cc-monitor/docker/data:/data/.cc-monitor \
              ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.version }}
            ```

            ### 📱 Android
            Download the APK below and install via ADB:
            ```bash
            adb install app-release.apk
            ```

            ### 🧩 DSH reporter plugin
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/BolunHan/cc-monitor/${{ github.ref_name }}/scripts/install-dsh-plugin.sh) https://github.com/BolunHan/cc-monitor/releases/download/${{ github.ref_name }}/dsh-cc-monitor.tgz
            ```

            ### 📦 Docker (offline)
            ```bash
            gunzip -c cc-monitor-${{ needs.docker.outputs.version }}.tar.gz | docker load
            docker run --network=host \
              -v ~/.cc-monitor/docker/data:/data/.cc-monitor \
              ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.version }}
            ```
          files: |
            cc-monitor-${{ needs.docker.outputs.version }}.tar.gz
            app-release.apk
            dsh-cc-monitor.tgz
          generate_release_notes: true
