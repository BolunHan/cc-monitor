name: Release

on:
    push:
        tags: ["v*.*.*"]

permissions:
    contents: write
    packages: write
    actions: read

jobs:
    docker:
        uses: ./.github/workflows/build-docker.yml
        with:
            version: ${{ github.ref_name }}
        secrets: inherit

    apk:
        uses: ./.github/workflows/build-apk.yml
        with:
            version: ${{ github.ref_name }}
        secrets: inherit

    release:
        needs: [docker, apk]
        runs-on: ubuntu-latest
        steps:
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Log in to GitHub Container Registry
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Download APK artifact
                uses: actions/download-artifact@v4
                with:
                    name: cc-monitor-${{ needs.apk.outputs.version }}.apk

            -   name: Pull and export Docker image as tar
                run: |
                    VERSION="${{ needs.docker.outputs.version }}"
                    IMAGE="${{ needs.docker.outputs.image }}"
                    docker pull "${IMAGE}:${VERSION}"
                    docker save "${IMAGE}:${VERSION}" | gzip > "cc-monitor-${VERSION}.tar.gz"

            -   name: Create GitHub Release
                uses: softprops/action-gh-release@v2
                with:
                    name: "cc-monitor v${{ needs.docker.outputs.version }}"
                    body: |
                        ## cc-monitor v${{ needs.docker.outputs.version }}

                        ### Docker
                        ```bash
                        docker pull ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.version }}
                        docker run -p 9876:9876 ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.version }}
                        ```

                        ### Android
                        Download the APK below and install via ADB:
                        ```bash
                        adb install cc-monitor-${{ needs.apk.outputs.version }}.apk
                        ```

                        ### Docker (offline)
                        ```bash
                        docker load -i cc-monitor-${{ needs.docker.outputs.version }}.tar.gz
                        docker run -p 9876:9876 ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.version }}
                        ```
                    files: |
                        cc-monitor-${{ needs.docker.outputs.version }}.tar.gz
                        app-release.apk
                    generate_release_notes: true
