name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        description: "Version tag (e.g. 0.5.0)"
        default: ""
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract metadata
        id: meta
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Flutter doctor
        working-directory: android_app
        run: flutter doctor -v

      - name: Install Flutter dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Diagnose v1 embedding
        working-directory: android_app
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== pubspec.yaml exists? ==="
          ls -la pubspec.yaml
          echo "=== Android manifest ==="
          cat android/app/src/main/AndroidManifest.xml
          echo "=== Check for io.flutter.app ==="
          grep -r "io.flutter.app" android/ 2>/dev/null || echo "(none found)"
          echo "=== All plugin manifests ==="
          find . -name "AndroidManifest.xml" -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Build release APK
        working-directory: android_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-monitor-${{ steps.meta.outputs.version }}
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
