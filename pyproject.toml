[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-monitor"
dynamic = ["version"]
description = "Monitor Claude Code and DSH working status via hooks/plugins"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=42.0.0",
    "zeroconf>=0.132.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
cc-monitor = "cc_monitor.server:main"

[tool.hatch.version]
path = "src/cc_monitor/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
