<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cc-monitor</title>
    <link rel="stylesheet" href="./css/app.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">cc-monitor</h1>
        <div class="header__actions">
            <div id="hooks-banner" class="hooks-banner hidden">
                <span class="hooks-banner__badge">⚠ global hooks not installed</span>
                <button class="btn btn--warning" id="btn-install-hooks">Install Global Hooks</button>
                <span class="install-feedback" id="install-feedback"></span>
            </div>
            <div class="header__status">
                <span class="connection-indicator" id="connection-indicator" title="SSE connection status"></span>
                <span class="connection-label" id="connection-label">connecting</span>
            </div>
            <button class="btn btn--icon" id="btn-settings" title="Settings">⚙</button>
        </div>
    </header>

    <div class="settings-panel hidden" id="settings-panel">
        <div class="settings-panel__content">
            <h3 class="settings-panel__title">Settings</h3>
            <div class="settings-panel__fields">
                <label class="settings-panel__label">
                    Server URL
                    <input type="text" class="settings-panel__input" id="settings-url" placeholder="http://127.0.0.1">
                </label>
                <label class="settings-panel__label">
                    Port
                    <input type="number" class="settings-panel__input settings-panel__input--short" id="settings-port" placeholder="9876">
                </label>
            </div>
            <button class="btn btn--primary" id="btn-save-settings">Save &amp; Reconnect</button>
            <span class="settings-panel__feedback" id="settings-feedback"></span>
            <hr class="settings-panel__divider">
            <div class="settings-panel__row">
                <span class="settings-panel__label-text">Global hooks</span>
                <span class="settings-panel__hook-status" id="settings-hook-status">checking…</span>
                <button class="btn btn--danger btn--small" id="btn-uninstall-hooks">Uninstall</button>
            </div>
        </div>
    </div>

    <main class="main">
        <!-- Active sessions (default expanded) -->
        <section class="section" id="section-active">
            <div class="section__header" data-section="active">
                <span class="section__toggle">▼</span>
                <h2 class="section__title">Active</h2>
                <span class="section__count" id="count-active">0</span>
            </div>
            <div class="section__body" id="body-active">
                <div class="session-grid" id="grid-active"></div>
                <p class="empty-state" id="empty-active">No active sessions</p>
            </div>
        </section>

        <!-- Completed sessions (default collapsed) -->
        <section class="section section--collapsed" id="section-complete">
            <div class="section__header" data-section="complete">
                <span class="section__toggle">▶</span>
                <h2 class="section__title">Complete</h2>
                <span class="section__count" id="count-complete">0</span>
            </div>
            <div class="section__body hidden" id="body-complete">
                <div class="session-grid" id="grid-complete"></div>
                <p class="empty-state" id="empty-complete">No completed sessions</p>
            </div>
        </section>

        <!-- Archived sessions (default collapsed) -->
        <section class="section section--collapsed" id="section-archive">
            <div class="section__header" data-section="archive">
                <span class="section__toggle">▶</span>
                <h2 class="section__title">Archived</h2>
                <span class="section__count" id="count-archive">0</span>
            </div>
            <div class="section__body hidden" id="body-archive">
                <div class="session-grid" id="grid-archive"></div>
                <p class="empty-state" id="empty-archive">No archived sessions</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span class="footer__version" id="footer-version">cc-monitor v—</span>
    </footer>

    <script src="./js/app.js"></script>
</body>
</html>
